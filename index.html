<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>API Dashboard</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <header class="dashboard-header">

  <div>
    <h1>API Dashboard</h1>

    <p>
      Аналитическая панель с данными пользователей, постов и комментариев
    </p>
  </div>

  <button id="refresh-button">
    Обновить данные
  </button>

</header>

  <div id="error-message"></div>

 <div id="loading-message">

  <div class="loader"></div>

  <span>Загрузка данных...</span>

</div>


  <!-- ========================= -->
  <!-- Статистика -->
  <!-- ========================= -->

  <div class="stat-card">
    <span>Пользователи</span>
    <strong id="users-count">—</strong>
  </div>

  <div class="stat-card">
    <span>Посты</span>
    <strong id="posts-count">—</strong>
  </div>

  <div class="stat-card">
    <span>Комментарии</span>
    <strong id="comments-count">—</strong>
  </div>

  <div class="stat-card">
    <span>Постов на пользователя</span>
    <strong id="posts-per-user">—</strong>
  </div>

</div>


  <!-- ========================= -->
  <!-- График -->
  <!-- ========================= -->

  <h2>Общая статистика</h2>

  <div class="chart-container">
    <canvas id="overview-chart"></canvas>
  </div>


  <!-- ========================= -->
  <!-- Пользователи -->
  <!-- ========================= -->

  <h2>Пользователи</h2>

  <div class="users-controls">

  <div class="search-wrapper">
    <input
      type="text"
      id="user-search"
      placeholder="Поиск по имени..."
    >
  </div>

  <select id="user-sort">
    <option value="default">
      Без сортировки
    </option>

    <option value="name-asc">
      Имя: А → Я
    </option>

    <option value="name-desc">
      Имя: Я → А
    </option>
  </select>

</div>

  <div id="users-list"></div>

  <div id="pagination"></div>


  <!-- ========================= -->
  <!-- Посты -->
  <!-- ========================= -->

  <h2>Последние посты</h2>

  <div id="posts-list"></div>


  <!-- ========================= -->
  <!-- Комментарии -->
  <!-- ========================= -->

  <h2>Последние комментарии</h2>

  <div id="comments-list"></div>


  <!-- ========================= -->
  <!-- JavaScript -->
  <!-- ========================= -->

  <script type="module" src="js/api.js"></script>

</body>

</html>
